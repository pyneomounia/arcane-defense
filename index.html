<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <title>Arcane Survival</title>
  <link rel="stylesheet" href="src/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body class="element-menu-open">
  <main id="game-shell">
    <header class="topbar">
      <div class="brand">
        <span class="orb" aria-hidden="true"></span>
        <div>
          <strong>ARCANE SURVIVAL</strong>
          <small>PROTÓTIPO · MAGIA ELEMENTAL</small>
        </div>
      </div>
      <div class="status">
        <span>ELEMENTO <b id="selected-element">ESCOLHA</b></span>
        <span>CONTROLE <b>WASD / SETAS</b></span>
      </div>
    </header>

    <section id="game-container" aria-label="Arena de treinamento">
      <div id="element-select" class="element-select">
        <img
          class="element-background"
          src="assets/ui/element-selection.webp"
          alt="Escolha seu elemento inicial: fogo, gelo, água ou terra"
        >
        <div class="element-hitboxes" role="group" aria-label="Escolha seu elemento inicial">
          <button class="element-hitbox hitbox-fire" data-element="fire" type="button" aria-label="Selecionar Fogo"></button>
          <button class="element-hitbox hitbox-ice" data-element="ice" type="button" aria-label="Selecionar Gelo"></button>
          <button class="element-hitbox hitbox-water" data-element="water" type="button" aria-label="Selecionar Água"></button>
          <button class="element-hitbox hitbox-earth" data-element="earth" type="button" aria-label="Selecionar Terra"></button>
        </div>
      </div>
    </section>

    <footer class="help">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ou <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> para movimentar</span>
      <span>O mago lança a magia na direção para a qual está olhando.</span>
    </footer>

    <p id="message" role="status">Carregando o mundo e as animações...</p>
  </main>

  <script defer src="src/main.js"></script>
</body>
</html>
