<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <title>Arcane Survival — Treino 01</title>
  <link rel="stylesheet" href="src/style.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <main id="game-shell">
    <header class="topbar">
      <div class="brand">
        <span class="orb" aria-hidden="true"></span>
        <div>
          <strong>ARCANE SURVIVAL</strong>
          <small>PROTÓTIPO · ETAPA 01</small>
        </div>
      </div>
      <div class="status">
        <span>OBJETIVO <b>EXPLORAR</b></span>
        <span>CONTROLE <b>WASD / SETAS</b></span>
      </div>
    </header>

    <section id="game-container" aria-label="Arena de treinamento"></section>

    <footer class="help">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ou <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> para movimentar</span>
      <span>O mago é controlado pelo teclado. A câmera acompanha o personagem.</span>
    </footer>

    <p id="message" role="status">Treino 01: caminhe pela arena e explore o cenário.</p>
  </main>

  <script src="src/main.js"></script>
</body>
</html>
